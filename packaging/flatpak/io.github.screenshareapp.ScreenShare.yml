# Build locally:
#   python3 flatpak-cargo-generator.py ../../Cargo.lock -o cargo-sources.json
#   flatpak-builder --user --install --force-clean build io.github.screenshareapp.ScreenShare.yml
#
# flatpak-cargo-generator.py comes from https://github.com/flatpak/flatpak-builder-tools
# and must be re-run whenever Cargo.lock changes.
app-id: io.github.screenshareapp.ScreenShare
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: screenshareapp
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio playback and capturing other applications' audio streams.
  - --filesystem=xdg-run/pipewire-0
  # Screen and window capture go through the ScreenCast portal (no extra permission).
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    CARGO_HOME: /run/build/screenshareapp/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
    # Link our FFmpeg below, not the runtime's copy.
    RUSTFLAGS: -L native=/app/lib
modules:
  # NVENC/NVDEC headers; the driver libraries come from the host through the
  # org.freedesktop.Platform.GL.nvidia extension. 12.1 works with drivers >= 530.
  - name: nv-codec-headers
    buildsystem: simple
    build-commands:
      - make PREFIX=/app install
    cleanup: ["*"]
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        tag: n12.1.14.0
        commit: 1889e62e2d35ff7aa9baca2bceb14f053785e6f1

  # LGPL FFmpeg with only what the app uses: H.264 decoding (software, NVDEC,
  # VAAPI) and GPU H.264 encoding (NVENC, VAAPI).
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-programs
      - --disable-doc
      - --disable-avdevice
      - --disable-avformat
      - --disable-avfilter
      - --disable-swscale
      - --disable-swresample
      - --disable-everything
      - --disable-autodetect
      - --enable-decoder=h264
      - --enable-parser=h264
      - --enable-ffnvcodec
      - --enable-nvenc
      - --enable-nvdec
      - --enable-cuda
      - --enable-vaapi
      - --enable-libdrm
      - --enable-encoder=h264_nvenc,h264_vaapi
      - --enable-hwaccel=h264_nvdec,h264_vaapi
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.1
        commit: 9047fa1b084f76b1b4d065af2d743df1b40dfb56

  - name: screenshareapp
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked -p screenshareapp
      - install -Dm755 target/release/screenshareapp -t /app/bin/
      - install -Dm644 packaging/linux/io.github.screenshareapp.ScreenShare.desktop -t /app/share/applications/
      - install -Dm644 packaging/linux/io.github.screenshareapp.ScreenShare.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 packaging/linux/io.github.screenshareapp.ScreenShare.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json

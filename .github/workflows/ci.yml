name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p screenshareapp

      - name: Build MSI
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-wix --locked
          cargo wix -p screenshareapp --no-build --nocapture --output target/wix/screenshare.msi

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libfuse2
          bash packaging/appimage/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshare-${{ runner.os }}
          path: |
            target/release/screenshareapp.exe
            target/wix/*.msi
            target/appimage/*.AppImage
          if-no-files-found: ignore

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.msi
            dist/**/*.AppImage
            dist/**/*.exe

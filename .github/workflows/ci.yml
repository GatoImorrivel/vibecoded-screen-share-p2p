name: CI

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Pin so the FFmpeg cache key stays stable across runs.
  FFMPEG_TAG: n8.1-latest
  FFMPEG_VARIANT: lgpl-shared-8.1

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libva* : BtbN FFmpeg dlopens these; without them a VAAPI probe aborts the process.
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config nasm lld \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libfuse2 libva2 libva-drm2

      # nasm so openh264 builds its assembly (otherwise it's ~2x slower).
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: FFmpeg cache
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ env.FFMPEG_TAG }}-${{ env.FFMPEG_VARIANT }}

      # LGPL shared FFmpeg for GPU video (NVENC, AMF, Quick Sync, VAAPI, ...).
      # Its libraries ship inside the MSI, portable zip and AppImage. On Linux,
      # libva and the GPU drivers are loaded from the user's system at runtime.
      - name: Fetch FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          dir="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" \
              "$base/ffmpeg-${FFMPEG_TAG}-win64-${FFMPEG_VARIANT}.zip"
            unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg-unpack"
            # Archive has a single top-level directory; flatten into $dir.
            mv "$RUNNER_TEMP"/ffmpeg-unpack/*/* "$dir"
          else
            curl -fsSL "$base/ffmpeg-${FFMPEG_TAG}-linux64-${FFMPEG_VARIANT}.tar.xz" \
              | tar -xJ -C "$dir" --strip-components=1
          fi

      - name: Export FFmpeg env
        shell: bash
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          else
            echo "LD_LIBRARY_PATH=$dir/lib" >> "$GITHUB_ENV"
            # Prefer our FFmpeg over the system one; use lld for faster links.
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld -L native=$dir/lib" >> "$GITHUB_ENV"
          fi

      - name: Cache linuxdeploy
        if: runner.os == 'Linux'
        id: cache-linuxdeploy
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/linuxdeploy
          key: linuxdeploy-x86_64-continuous

      - name: Fetch linuxdeploy
        if: runner.os == 'Linux' && steps.cache-linuxdeploy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/linuxdeploy
          curl -fsSL -o .cache/linuxdeploy/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x .cache/linuxdeploy/linuxdeploy-x86_64.AppImage

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          components: rustfmt, clippy

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@v2

      # Lint and test once on Linux; Windows only builds the release artifacts.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p screenshareapp

      - name: Install cargo-wix
        if: runner.os == 'Windows'
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-wix@0.3.9

      - name: Build MSI and portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # BtbN's shared avcodec imports swresample (and the full set is small);
          # shipping only avcodec+avutil left Windows unable to start.
          cp "$FFMPEG_DIR"/bin/av*.dll "$FFMPEG_DIR"/bin/sw*.dll target/release/
          avcodec=$(cd target/release && ls avcodec-*.dll)
          avutil=$(cd target/release && ls avutil-*.dll)
          swresample=$(cd target/release && ls swresample-*.dll)
          swscale=$(cd target/release && ls swscale-*.dll)
          avformat=$(cd target/release && ls avformat-*.dll)
          avfilter=$(cd target/release && ls avfilter-*.dll)
          avdevice=$(cd target/release && ls avdevice-*.dll)
          cargo wix -p screenshareapp --no-build --nocapture \
            -C "-dAvcodecDll=$avcodec" \
            -C "-dAvutilDll=$avutil" \
            -C "-dSwresampleDll=$swresample" \
            -C "-dSwscaleDll=$swscale" \
            -C "-dAvformatDll=$avformat" \
            -C "-dAvfilterDll=$avfilter" \
            -C "-dAvdeviceDll=$avdevice" \
            --output target/wix/screenshare.msi
          mkdir -p target/portable/screenshare
          cp target/release/screenshareapp.exe \
            target/release/av*.dll target/release/sw*.dll \
            target/portable/screenshare/
          cp "$FFMPEG_DIR/LICENSE.txt" target/portable/screenshare/FFMPEG-LICENSE.txt
          (cd target/portable && 7z a -bd screenshare-windows-portable.zip screenshare >/dev/null)

      - name: Build AppImage
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY: ${{ github.workspace }}/.cache/linuxdeploy/linuxdeploy-x86_64.AppImage
        run: bash packaging/appimage/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshare-${{ runner.os }}
          path: |
            target/portable/*.zip
            target/wix/*.msi
            target/appimage/*.AppImage
          if-no-files-found: ignore

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.msi
            dist/**/*.AppImage
            dist/**/*.zip
